name: Linux executable

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # cudarc needs a CUDA API version at build time; with this set no toolkit is required.
  # The driver libraries (libcuda, libnvrtc) are loaded dynamically at runtime.
  CUDARC_CUDA_VERSION: "12080"
  BIN_NAME: neural-machine-translation

jobs:
  build:
    # Oldest supported runner -> oldest glibc -> binary runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked --features bundle

      - name: Package
        run: |
          mkdir -p dist
          cp "target/release/$BIN_NAME" "dist/$BIN_NAME"
          tar -czf "$BIN_NAME-linux-x86_64.tar.gz" -C dist "$BIN_NAME"
          sha256sum "$BIN_NAME-linux-x86_64.tar.gz" > "$BIN_NAME-linux-x86_64.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-linux-x86_64
          path: |
            ${{ env.BIN_NAME }}-linux-x86_64.tar.gz
            ${{ env.BIN_NAME }}-linux-x86_64.tar.gz.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BIN_NAME }}-linux-x86_64.tar.gz
            ${{ env.BIN_NAME }}-linux-x86_64.tar.gz.sha256
